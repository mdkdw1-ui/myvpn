name: build-profiles

on:
  workflow_dispatch:

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: python get_ovpn.py

      - uses: actions/upload-artifact@v4
        with:
          name: ovpn-profiles
          path: out/*.ovpn
          retention-days: 3
          if-no-files-found: error
